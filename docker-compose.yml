services:
  postgres:
    image: postgres:16-alpine
    container_name: bhc-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-bhc}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-bhc}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-bhc} -d ${POSTGRES_DB:-bhc}"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Baked into the client bundle by `next build` — must be a build arg,
        # not a runtime env var, or the GTM snippet will render empty.
        NEXT_PUBLIC_GTM_ID: ${NEXT_PUBLIC_GTM_ID:-}
    container_name: bhc-web
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "3000"
    environment:
      NODE_ENV: production
      DATABASE_URI: postgres://${POSTGRES_USER:-bhc}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-bhc}
      PAYLOAD_SECRET: ${PAYLOAD_SECRET:?set PAYLOAD_SECRET in .env}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost}
      # Mirrored at runtime for SSR consistency. Build-time arg above is the
      # one Next actually inlines into the bundle.
      NEXT_PUBLIC_GTM_ID: ${NEXT_PUBLIC_GTM_ID:-}
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-admin@blackhartconsulting.com}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-changeme123!}
      # S3-compatible media storage (DigitalOcean Spaces). When all four are
      # set, Payload's storage-s3 plugin sends uploads to the bucket instead
      # of the local /app/media volume. Missing \u2192 falls back to local.
      S3_BUCKET: ${S3_BUCKET:-}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_REGION: ${S3_REGION:-}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      S3_PUBLIC_URL: ${S3_PUBLIC_URL:-}
      # Transactional email via Resend. When RESEND_API_KEY is set, Payload
      # uses it for admin + contact-form notifications. Missing -> console log.
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
      CONTACT_NOTIFY_EMAIL: ${CONTACT_NOTIFY_EMAIL:-}
      # Seed control. SEED_ON_BOOT=false skips seeding entirely; the FORCE_*
      # flags are one-shot migration switches that re-upsert specific content
      # from src/seed/onInit.ts when set to "true" in .env. After landing the
      # new content, REMOVE the flags from .env and recreate the container so
      # admin-UI edits become the source of truth again.
      SEED_ON_BOOT: ${SEED_ON_BOOT:-true}
      FORCE_HOME_UPSERT: ${FORCE_HOME_UPSERT:-}
      FORCE_ABOUT_UPSERT: ${FORCE_ABOUT_UPSERT:-}
      FORCE_SERVICES_UPSERT: ${FORCE_SERVICES_UPSERT:-}
      FORCE_CONTACT_UPSERT: ${FORCE_CONTACT_UPSERT:-}
      FORCE_ARTICLES_UPSERT: ${FORCE_ARTICLES_UPSERT:-}
      FORCE_PM_UPSERT: ${FORCE_PM_UPSERT:-}
      FORCE_WAYGFT_UPSERT: ${FORCE_WAYGFT_UPSERT:-}
    volumes:
      - media:/app/media

  caddy:
    image: caddy:2-alpine
    container_name: bhc-caddy
    restart: unless-stopped
    depends_on:
      - web
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  pgdata:
  media:
  caddy_data:
  caddy_config:
