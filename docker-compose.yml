services:
  postgres:
    image: postgres:16-alpine
    container_name: bhc-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: bhc
      POSTGRES_PASSWORD: change-me
      POSTGRES_DB: bhc
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bhc -d bhc"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bhc-web
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      DATABASE_URI: postgres://bhc:change-me@postgres:5432/bhc
      PAYLOAD_SECRET: ${PAYLOAD_SECRET}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
    volumes:
      - media:/app/media

volumes:
  pgdata:
  media:
