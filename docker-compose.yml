services:
  postgres:
    image: postgres:16-alpine
    container_name: bhc-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-bhc}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-bhc}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-bhc} -d ${POSTGRES_DB:-bhc}"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Baked into the client bundle by `next build` — must be a build arg,
        # not a runtime env var, or the GTM snippet will render empty.
        NEXT_PUBLIC_GTM_ID: ${NEXT_PUBLIC_GTM_ID:-}
        # Microsoft Clarity project ID — same constraint as GTM (build arg,
        # not runtime), or the Clarity snippet won't get inlined.
        NEXT_PUBLIC_CLARITY_PROJECT_ID: ${NEXT_PUBLIC_CLARITY_PROJECT_ID:-}
    container_name: bhc-web
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "3000"
    environment:
      NODE_ENV: production
      DATABASE_URI: postgres://${POSTGRES_USER:-bhc}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-bhc}
      PAYLOAD_SECRET: ${PAYLOAD_SECRET:?set PAYLOAD_SECRET in .env}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost}
      # Mirrored at runtime for SSR consistency. Build-time arg above is the
      # one Next actually inlines into the bundle.
      NEXT_PUBLIC_GTM_ID: ${NEXT_PUBLIC_GTM_ID:-}
      NEXT_PUBLIC_CLARITY_PROJECT_ID: ${NEXT_PUBLIC_CLARITY_PROJECT_ID:-}
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-admin@blackhartconsulting.com}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-changeme123!}
      # S3-compatible media storage (DigitalOcean Spaces). When all four are
      # set, Payload's storage-s3 plugin sends uploads to the bucket instead
      # of the local /app/media volume. Missing \u2192 falls back to local.
      S3_BUCKET: ${S3_BUCKET:-}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_REGION: ${S3_REGION:-}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      S3_PUBLIC_URL: ${S3_PUBLIC_URL:-}
      # Transactional email via Resend. When RESEND_API_KEY is set, Payload
      # uses it for admin + contact-form notifications. Missing -> console log.
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
      CONTACT_NOTIFY_EMAIL: ${CONTACT_NOTIFY_EMAIL:-}
      # RentCast AVM key for the Toke Properties prospect-demo valuation route.
      RENTCAST_API_KEY: ${RENTCAST_API_KEY:-}
      # Seed control. SEED_ON_BOOT=false skips seeding entirely; the FORCE_*
      # flags are one-shot migration switches that re-upsert specific content
      # from src/seed/onInit.ts when set to "true" in .env. After landing the
      # new content, REMOVE the flags from .env and recreate the container so
      # admin-UI edits become the source of truth again.
      SEED_ON_BOOT: ${SEED_ON_BOOT:-true}
      FORCE_HOME_UPSERT: ${FORCE_HOME_UPSERT:-}
      FORCE_ABOUT_UPSERT: ${FORCE_ABOUT_UPSERT:-}
      FORCE_SERVICES_UPSERT: ${FORCE_SERVICES_UPSERT:-}
      FORCE_CONTACT_UPSERT: ${FORCE_CONTACT_UPSERT:-}
      # One-shot bypass for the dev-only routes (/dev-seed-rework,
      # /dev-schema-fix, etc). When set to "one-time-yes" in .env + the
      # container is RECREATED (docker compose up -d, not restart), the
      # routes accept POSTs in production. Remove from .env + recreate
      # again to relock.
      ALLOW_DEV_SEED: ${ALLOW_DEV_SEED:-}
      FORCE_ARTICLES_UPSERT: ${FORCE_ARTICLES_UPSERT:-}
      FORCE_PM_UPSERT: ${FORCE_PM_UPSERT:-}
      FORCE_WAYGFT_UPSERT: ${FORCE_WAYGFT_UPSERT:-}
      FORCE_MISBAH_UPSERT: ${FORCE_MISBAH_UPSERT:-}
      FORCE_SIDECAR_UPSERT: ${FORCE_SIDECAR_UPSERT:-}
      FORCE_SIDECAR_TEACHABLE_UPSERT: ${FORCE_SIDECAR_TEACHABLE_UPSERT:-}
      FORCE_CERTO_UPSERT: ${FORCE_CERTO_UPSERT:-}
      # Google PageSpeed Insights API key — used by the /api/pagespeed-audit
      # endpoint to authenticate requests against the project's own quota
      # (25k queries/day) instead of the shared anonymous tier. Optional:
      # endpoint falls back to anonymous PSI calls when the key is unset.
      PAGESPEED_API_KEY: ${PAGESPEED_API_KEY:-}
      # Stripe — required for /invoice payment flow + /api/stripe/webhook.
      # Both keys come from the Stripe dashboard:
      #   STRIPE_SECRET_KEY  → Developers → API keys (sk_test_… / sk_live_…)
      #   STRIPE_WEBHOOK_SECRET → Developers → Webhooks → your endpoint
      #     → Signing secret (whsec_…). One per webhook endpoint, so prod
      #     and dev tunnels each have their own.
      # Missing keys → /api/checkout/start and webhook return 503 instead
      # of crashing the whole site, so it's safe to deploy without them
      # set during initial bring-up.
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      # Comma-separated list of payment method types to offer at checkout.
      # Must match what's enabled in your Stripe dashboard (Settings →
      # Payment methods). Defaults in code to card,us_bank_account,klarna,
      # link,cashapp. Affirm is intentionally absent — Stripe blocks it for
      # consulting categories. Re-add `,affirm` here once your account has
      # been re-categorised to "Web design and development" and Affirm
      # re-approves.
      STRIPE_PAYMENT_METHOD_TYPES: ${STRIPE_PAYMENT_METHOD_TYPES:-}
      # Billing emails — invoices/care-plan/payment-failed. Falls back to
      # EMAIL_FROM if unset.
      EMAIL_FROM_BILLING: ${EMAIL_FROM_BILLING:-}
      # Slack incoming webhook for operator notifications. Phase C will
      # wire the integration code — env var staged early so the prod
      # deploy doesn't need a second container restart.
      SLACK_BILLING_WEBHOOK_URL: ${SLACK_BILLING_WEBHOOK_URL:-}
      # Shared secret for /api/cron/billing-ops invocations. Set this in
      # .env, then wire a cron entry on the host (or the droplet's
      # crontab) that POSTs to /api/cron/billing-ops with the matching
      # x-cron-key header. Skipping = the cron endpoint refuses all calls.
      CRON_SECRET: ${CRON_SECRET:-}
      # Dev-environment access gate. When DEV_AUTH_ENABLED=true, every
      # route except /dev-login + /api/dev-auth/* + /api/stripe/webhook
      # requires a signed cookie issued by the styled login form. Used on
      # dev.blackhartconsulting.com to replace the browser-popup HTTP
      # Basic Auth with a branded page. Unset on prod (gate is a no-op).
      DEV_AUTH_ENABLED: ${DEV_AUTH_ENABLED:-}
      DEV_AUTH_PASSWORD: ${DEV_AUTH_PASSWORD:-}
      DEV_AUTH_SECRET: ${DEV_AUTH_SECRET:-}
    volumes:
      - media:/app/media
      # Persist the Next.js image-optimization cache across container
      # rotations. Without this, every deploy nukes all the cached Sharp
      # transforms in /app/.next/cache/images and the next visitor pays
      # a ~450ms cold-transform cost on every srcset variant. With the
      # volume the cache survives deploys and warm transforms (~80ms)
      # serve immediately.
      - next_image_cache:/app/.next/cache/images

  caddy:
    image: caddy:2-alpine
    container_name: bhc-caddy
    restart: unless-stopped
    depends_on:
      - web
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      # CADDYFILE_PATH lets a non-prod environment point Caddy at a
      # different host file without diverging the in-git Caddyfile. On
      # prod the var stays unset and the default `./Caddyfile` is used —
      # the file checked into git. On dev, set CADDYFILE_PATH=./Caddyfile.dev
      # in /opt/bhc-web/.env and put the dev-specific config (Basic Auth,
      # dev domain, X-Robots-Tag) in /opt/bhc-web/Caddyfile.dev (gitignored).
      # Decouples dev's bespoke Caddy config from prod's so `git pull` on
      # dev never conflicts on Caddyfile changes.
      - ${CADDYFILE_PATH:-./Caddyfile}:/etc/caddy/Caddyfile:ro
      # Sorenori email-confirmation static page → served by the sorenori.blackhartconsulting.com vhost.
      - ./sorenori-confirm:/srv/sorenori:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  pgdata:
  media:
  caddy_data:
  caddy_config:
  next_image_cache:
